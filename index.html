<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test: Periodic Table</title>

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- Bootstrap 5 -->

</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <form class="p-4">
        <h1 style="font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;">

        </h1>
        <p>Enter an Actinoid and Search</p>

        <input type="text" id="dict" class="fw-bold form-control" placeholder="Enter symbol (e.g. U, Pu, Am)">

        <input type="button" class="btn btn-success" py-click="details" value="Search">
    </form>

    <div id="periodic" class="p-4"></div>

    <!-- Load the Python file the PyScript way -->
    <script type="py" src="main.py"></script>
